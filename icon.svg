<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle circular pulse rings in background -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.2" />

  <!-- Center Shield / Badge -->
  <g filter="url(#shadow)">
    <!-- Open Book / Study Foundation -->
    <path d="M 140 330 C 180 315 225 320 256 340 C 287 320 332 315 372 330 L 372 355 C 332 340 287 345 256 365 C 225 345 180 340 140 355 Z" fill="#94a3b8" opacity="0.6" />
    <path d="M 140 315 C 180 300 225 305 256 325 C 287 305 332 300 372 315 L 372 340 C 332 325 287 330 256 350 C 225 330 180 325 140 340 Z" fill="#ffffff" />
    
    <!-- Medical Cross with Rounded Ends -->
    <rect x="236" y="145" width="40" height="135" rx="14" fill="url(#glowGrad)" />
    <rect x="188.5" y="192.5" width="135" height="40" rx="14" fill="url(#glowGrad)" />
    
    <!-- Pulse Line / Heartbeat across the cross -->
    <path d="M 155 212.5 L 210 212.5 L 225 175 L 245 250 L 265 190 L 280 225 L 295 212.5 L 357 212.5" 
          fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Glowing study star at top right -->
    <circle cx="355" cy="155" r="10" fill="#38bdf8" />
  </g>
</svg>
